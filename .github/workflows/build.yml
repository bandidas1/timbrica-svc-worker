name: build-and-push

on:
  push:
    branches: [main, gpu-probe]
    paths:
      - "handler_*.py"
      - "svc_io.py"
      - "gpu_probe.py"
      - "bake_*.py"
      - "Dockerfile.*"
      - "requirements-*.txt"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Independent images — one engine failing must not cancel the other.
      fail-fast: false
      matrix:
        include:
          - engine: seedvc
            dockerfile: Dockerfile.seedvc
          - engine: soulx
            dockerfile: Dockerfile.soulx
    name: build ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4

      # torch + CUDA + baked checkpoints run to many GB — free the runner disk first.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags on purpose. The moving one (`:seedvc`) is convenient to pull by hand; the
      # immutable one (`:seedvc-<sha>`) is what you resolve to a digest and pin a RunPod
      # template at. The templates hold `...@sha256:<digest>`, so a rebuild reaches nothing
      # until the template's imageName is updated — 2026-07-09 a rebuilt `:soulx` plus a
      # workersMax 0→2 cycle still answered with the previous handler, because the digest
      # never moved. Updating the template is also not enough on its own: an already-running
      # worker keeps its container, so drain to workersMax 0 (watch /health until
      # workers.ready is 0) before scaling back up.
      - name: Build and push (${{ matrix.engine }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/timbrica-svc-worker:${{ matrix.engine }}${{ github.ref_name == 'main' && '' || format('-{0}', github.ref_name) }}
            ghcr.io/${{ github.repository_owner }}/timbrica-svc-worker:${{ matrix.engine }}-${{ github.sha }}
          provenance: false

      # ── Does this image actually START? ────────────────────────────────────
      #
      # 2026-08-18 both SVC endpoints spent three days with workers that never
      # reached "ready": jobs queued, nothing dispatched, $19.88 billed for 28.7
      # worker-hours and zero completed jobs. A control run proved the endpoint
      # and the hosts were fine — the same endpoint booted a different image in
      # 425 s. The image itself could not start, and nobody could see why:
      # RunPod shows worker logs only in its console, and a container that dies
      # before the SDK starts leaves no trace in any API.
      #
      # So the check moves here, where it is free and repeatable. This is a real
      # import of seed-vc / SoulX inside the built image — the exact thing a
      # torch or CUDA change breaks — WITHOUT loading weights, so it costs
      # seconds and no GPU. An image that cannot import can no longer reach a
      # paid endpoint.
      - name: Smoke — the image must import its own stack
        run: |
          set -eu
          IMG="ghcr.io/${{ github.repository_owner }}/timbrica-svc-worker:${{ matrix.engine }}-${{ github.sha }}"
          docker pull "$IMG"
          docker run --rm --entrypoint python "$IMG" - <<'PY'
          import os, sys, types, traceback

          def step(name, fn):
              try:
                  fn()
                  print(f"  ok   {name}", flush=True)
              except BaseException:
                  print(f"  FAIL {name}", flush=True)
                  traceback.print_exc()
                  sys.exit(1)

          import torch, torchaudio, numpy, soundfile
          print(f"torch={torch.__version__} torchaudio={torchaudio.__version__} "
                f"cuda={torch.version.cuda} numpy={numpy.__version__}", flush=True)

          step("gpu_probe", lambda: __import__("gpu_probe"))
          step("svc_io", lambda: __import__("svc_io"))

          # The engine's own package — where a torch upgrade actually explodes
          # (pinned deps compiled against an older ABI). No weights are loaded.
          root = os.environ.get("SEED_VC_DIR") or os.environ.get("SOULX_DIR")
          if root and os.path.isdir(root):
              sys.path.insert(0, root)
              os.chdir(root)
              sys.modules.setdefault("gradio", types.ModuleType("gradio"))
              mod = "app_svc" if "seed" in root else "soulxsinger"
              step(f"{mod} (engine package)", lambda: __import__(mod))
          print("image starts", flush=True)
          PY

      - name: Image ref to pin the RunPod template at
        run: |
          echo "::notice title=Resolve this tag to a digest and pin the template at it::ghcr.io/${{ github.repository_owner }}/timbrica-svc-worker:${{ matrix.engine }}-${{ github.sha }}"
